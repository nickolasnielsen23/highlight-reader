<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Highlight Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: the book as a reading column, with your highlights in a sticky rail beside it. E-ink paper palette. */
:root {
  --paper: #ecebe6; --sheet: #f8f7f3; --ink: #1c1d1f; --ink-soft: #5d6066; --rule: #d6d5ce;
  --accent: #2d4f7c; --accent-ink: #ffffff; --tint: #e3e2db; --warn: #9b3d22;
  --hl0: #f2c230; --hl1: #f2c230; --hl2: #ee7aa0; --hl3: #5aa7ee; --hl4: #63c27a; --mark-mix: 46%;
  --font-read: "Literata", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --top-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121314; --sheet: #1a1b1d; --ink: #e4e3de; --ink-soft: #9c9ea3; --rule: #2e3033;
    --accent: #93b4e0; --accent-ink: #0f1a2a; --tint: #25272b; --warn: #e3907a; --mark-mix: 34%; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121314; --sheet: #1a1b1d; --ink: #e4e3de; --ink-soft: #9c9ea3; --rule: #2e3033;
  --accent: #93b4e0; --accent-ink: #0f1a2a; --tint: #25272b; --warn: #e3907a; --mark-mix: 34%; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.c0 { --hlc: var(--hl0); } .c1 { --hlc: var(--hl1); } .c2 { --hlc: var(--hl2); } .c3 { --hlc: var(--hl3); } .c4 { --hlc: var(--hl4); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; height: var(--top-h); display: flex; align-items: center; gap: 14px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  background: var(--paper); border-bottom: 1px solid var(--rule); }
.brand { font-weight: 700; letter-spacing: -0.015em; white-space: nowrap; font-size: 15px; }
.brand .mk { background: color-mix(in srgb, var(--hl1) var(--mark-mix), transparent); padding: 0 3px; margin-left: -3px; border-radius: 2px; }
.book-id { flex: 1; min-width: 0; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.book-id b { color: var(--ink); font-weight: 600; }
.pill { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase; background: var(--tint); color: var(--ink-soft); vertical-align: 1px; }
.actions { display: flex; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--rule);
  background: var(--sheet); cursor: pointer; white-space: nowrap; font-size: 14px; font-weight: 500; }
.btn:hover { border-color: var(--ink-soft); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.short { display: none; }

/* workspace */
.tabs { display: none; }
.workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 410px); }
.workspace.no-book { grid-template-columns: minmax(0, 760px); justify-content: center; }
#reader { min-width: 0; padding-block: 48px 40vh; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: 32px; }
.workspace.no-book #reader { display: none; }
#panel { position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); min-width: 0;
  height: calc(100dvh - var(--top-h) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto; border-left: 1px solid var(--rule); background: var(--sheet); }
.workspace.no-book #panel { position: static; height: auto; overflow: visible; border-left: 0; background: transparent; }
.pad { padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.workspace.no-book .pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.panel-head { position: sticky; top: 0; z-index: 2; padding-block: 14px 12px; background: var(--sheet); border-bottom: 1px solid var(--rule); }
.workspace.no-book .panel-head { top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); background: var(--paper); padding-block: 22px 14px; }
.stats { font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }
.search { width: 100%; height: 36px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--rule); background: var(--paper); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--rule);
  background: var(--paper); font-size: 13px; cursor: pointer; font-variant-numeric: tabular-nums; }
.chip .sw { width: 10px; height: 10px; border-radius: 50%; background: var(--hlc); }
.chip[aria-pressed="false"] { opacity: .42; }
.chip.toggle[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.banners { display: grid; gap: 10px; padding-block: 14px 0; }
.banner { padding: 12px 14px; border-radius: 9px; background: var(--tint); font-size: 14px; display: grid; gap: 10px; }
.banner p { margin: 0; }
.banner .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.banner.warn { background: color-mix(in srgb, var(--warn) 15%, var(--sheet)); }
.banner details { font-size: 13px; color: var(--ink-soft); }
.banner summary { cursor: pointer; color: var(--ink); font-weight: 500; }
.banner details p { margin-top: 6px; }
.list { padding-block: 4px 48px; }
.group-title { font: 600 11.5px/1.3 var(--font-ui); text-transform: uppercase; letter-spacing: .07em; color: var(--ink-soft);
  margin: 24px 0 4px; display: flex; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; text-wrap: balance; }
.entry { padding: 12px 10px; margin: 0 -10px; border-bottom: 1px solid var(--rule); border-radius: 0; }
.entry:last-child { border-bottom: 0; }
.entry .quote { margin: 0; font: 400 1.02rem/1.6 var(--font-read); }
.entry .quote span { background: color-mix(in srgb, var(--hlc) var(--mark-mix), transparent); padding: 1px 2px;
  -webkit-box-decoration-break: clone; box-decoration-break: clone; border-radius: 2px; }
.entry .note { margin-top: 8px; padding: 8px 10px; border-radius: 7px; background: var(--tint); white-space: pre-wrap; font-size: 14px; }
.entry .note::before { content: "Note"; display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 2px; }
.entry .meta { margin-top: 6px; font-size: 12px; color: var(--ink-soft); display: flex; gap: 12px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.entry .meta .flag { color: var(--warn); }
.entry.bookmark .quote { font: 600 13px/1.4 var(--font-ui); color: var(--ink-soft); display: flex; align-items: center; gap: 8px; }
.ribbon { display: inline-block; width: 9px; height: 13px; background: var(--accent); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 72%, 0 100%); }
.entry.clickable { cursor: pointer; }
.entry.clickable:hover { background: var(--tint); }
.entry.active { background: var(--tint); box-shadow: inset 0 0 0 1.5px var(--accent); border-radius: 8px; }
.empty { color: var(--ink-soft); padding: 24px 0; text-align: center; }

/* book */
#reader .chapter { max-width: 38rem; margin: 0 auto; font: 400 1.1rem/1.75 var(--font-read); overflow-wrap: break-word; }
#reader .chapter + .chapter { margin-top: 3.5em; padding-top: 3em; border-top: 1px solid var(--rule); }
#reader h1, #reader h2, #reader h3, #reader h4 { line-height: 1.25; font-weight: 600; text-wrap: balance; }
#reader img, #reader svg { max-width: 100%; height: auto; }
#reader a { color: var(--accent); }
#reader sup, #reader sub { line-height: 0; }
#reader blockquote { margin: 1em 1.5em; }
#reader table { border-collapse: collapse; display: block; max-width: 100%; overflow-x: auto; }
#reader td, #reader th { border: 1px solid var(--rule); padding: 4px 8px; }
#reader [class*="italic" i] { font-style: italic; }
#reader [class*="bold" i] { font-weight: 600; }
#reader [class*="smallcap" i], #reader [class*="small-cap" i], #reader [class*="smcap" i] { font-variant: small-caps; }
#reader [class*="center" i] { text-align: center; }
#reader mark { color: inherit; background: color-mix(in srgb, var(--hlc) var(--mark-mix), transparent); border-radius: 2px; cursor: pointer; scroll-margin: 35vh 0; }
#reader mark.has-note { box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--hlc) 80%, var(--ink)); }
#reader mark mark { background: color-mix(in srgb, var(--hlc) 30%, transparent); }
#reader .bm { display: inline-block; width: 9px; height: 14px; margin: 0 2px; vertical-align: -1px; background: var(--accent);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 72%, 0 100%); cursor: pointer; scroll-margin: 35vh 0; }
#reader .anchor { display: inline-block; width: 0; scroll-margin: 35vh 0; }
#reader .flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 35% { outline: 3px solid var(--accent); outline-offset: 2px; } 100% { outline: 3px solid transparent; outline-offset: 2px; } }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60;
  max-width: min(560px, calc(100vw - 32px)); padding: 10px 16px; border-radius: 9px; background: var(--ink); color: var(--paper); font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
.toast.error { background: var(--warn); color: var(--sheet); }
.drag-veil { display: none; position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--accent) 12%, transparent); border: 3px dashed var(--accent); pointer-events: none; }
body.dragging .drag-veil { display: block; }
.sheet-veil { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.35); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { width: min(640px, 100%); background: var(--sheet); border-radius: 12px; padding: 18px; display: grid; gap: 12px; }
.sheet h2 { margin: 0; font-size: 16px; }
.sheet p { margin: 0; color: var(--ink-soft); font-size: 14px; }
.sheet textarea { width: 100%; height: 50vh; resize: vertical; border: 1px solid var(--rule); border-radius: 8px; padding: 10px; background: var(--paper); font: 13px/1.5 ui-monospace, Menlo, monospace; }
.sheet .row { display: flex; justify-content: flex-end; gap: 8px; }
@media (prefers-reduced-motion: reduce) { #reader .flash { animation: none; outline: 3px solid var(--accent); } }

@media (max-width: 899px) {
  .top { gap: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .book-id { display: none; }
  .brand { flex: 1; }
  .btn { padding: 0 11px; }
  .long { display: none; } .short { display: inline; }
  .workspace.has-book { grid-template-columns: minmax(0, 1fr); }
  .tabs.on { display: flex; position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); z-index: 9; background: var(--paper); border-bottom: 1px solid var(--rule);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .tabs button { flex: 1; height: 42px; border: 0; background: none; cursor: pointer; font-weight: 600; color: var(--ink-soft); border-bottom: 2px solid transparent; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  body:not(.show-panel) .workspace.has-book #panel { display: none; }
  body.show-panel .workspace.has-book #reader { display: none; }
  #panel { position: static; height: auto; border-left: 0; overflow: visible; background: var(--paper); }
  .pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .panel-head, .workspace.no-book .panel-head { background: var(--paper); }
  .workspace.has-book .panel-head { top: calc(var(--top-h) + 43px + env(safe-area-inset-top, 0px)); }
  #reader { padding-block: 24px 40vh; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #reader mark, #reader .bm, #reader .anchor { scroll-margin: 30vh 0; }
}
</style>

<header class="top">
  <div class="brand"><span class="mk">Highlight</span> Reader</div>
  <div class="book-id" id="bookId"></div>
  <div class="actions">
    <label class="btn primary" id="openBtn"><span class="long">Open files…</span><span class="short">Open</span><input type="file" id="pick" multiple></label>
    <button class="btn" id="copyBtn" type="button" title="Copy every highlight and note as text (Markdown), ready to paste into Notes, Docs or Obsidian"><span class="long">Copy notes</span><span class="short">Copy</span></button>
  </div>
</header>
<div class="drag-veil"></div>

<nav class="tabs" id="tabs" role="tablist">
  <button role="tab" id="tabBook" aria-selected="true" type="button">Book</button>
  <button role="tab" id="tabList" aria-selected="false" type="button">Highlights</button>
</nav>

<div class="workspace no-book" id="workspace">
  <article id="reader" aria-label="Book text"></article>
  <aside id="panel" aria-label="Highlights and notes">
    <div class="panel-head pad">
      <div class="stats" id="stats"></div>
      <input class="search" id="search" type="search" placeholder="Search highlights and notes" autocomplete="off" aria-label="Search highlights and notes">
      <div class="chips" id="chips"></div>
    </div>
    <div class="banners pad" id="banners"></div>
    <div class="list pad" id="list"></div>
  </aside>
</div>

<script>
'use strict';
const XHTML = 'http://www.w3.org/1999/xhtml', XLINK = 'http://www.w3.org/1999/xlink';
const ANS = 'http://ns.adobe.com/digitaleditions/annotations', DC = 'http://purl.org/dc/elements/1.1/';
const OPS = 'http://www.idpf.org/2007/ops';
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

const S = { annots: [], meta: null, book: null, placed: new Map(), byId: new Map(), q: '', colorsOff: new Set(), notesOnly: false, showBm: true,
  urls: [], sampleBook: false, sampleAnnots: false };

/* ---------------- small helpers ---------------- */
const dirOf = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/') + 1) : '';
function decodeSafe(s) { try { return decodeURIComponent(s); } catch { return s; } }
function resolvePath(base, href) {
  href = decodeSafe((href || '').split('#')[0]);
  const parts = (href.startsWith('/') ? href : base + href).split('/'), out = [];
  for (const s of parts) { if (s === '..') out.pop(); else if (s && s !== '.') out.push(s); }
  return out.join('/');
}
const xml = t => new DOMParser().parseFromString(t, 'application/xml');
function xhtml(raw) {
  let d = new DOMParser().parseFromString(raw, 'application/xhtml+xml');
  if (d.getElementsByTagName('parsererror').length || d.documentElement.namespaceURI !== XHTML)
    d = new DOMParser().parseFromString(raw, 'text/html');
  return d;
}
const bodyOf = d => d.getElementsByTagNameNS(XHTML, 'body')[0] || d.body || d.documentElement;
const colorKey = c => (/^[0-4]$/.test(c) ? c : '1');
const pct = p => isNaN(p) ? '' : `${Math.round(p * 100)}%`;
function fmtDate(iso) { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); }
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const MIME = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', svg: 'image/svg+xml', webp: 'image/webp', avif: 'image/avif' };

let toastTimer;
function toast(msg, isError) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = el('div', 'toast' + (isError ? ' error' : ''), msg); t.setAttribute('role', 'status');
  document.body.appendChild(t); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), isError ? 7000 : 2800);
}

/* ---------------- zip (EPUB) reader, no libraries ---------------- */
async function readZip(file) {
  if (!('DecompressionStream' in window)) throw new Error('This browser is too old to open EPUB files. Try a current Chrome, Safari or Firefox.');
  const buf = new Uint8Array(await file.arrayBuffer()), dv = new DataView(buf.buffer);
  let eocd = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error(`${file.name} isn't a readable EPUB file.`);
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const entries = new Map(), lower = new Map(), dec = new TextDecoder();
  for (let n = 0; n < count && p + 46 <= buf.length; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true), name = dec.decode(buf.subarray(p + 46, p + 46 + nl));
    entries.set(name, { method, csize, lho }); lower.set(name.toLowerCase(), name);
    p += 46 + nl + xl + cl;
  }
  const find = name => entries.has(name) ? name : (lower.get((name || '').toLowerCase()) || null);
  const cache = new Map();
  async function bytes(name) {
    name = find(name); if (!name) return null;
    if (cache.has(name)) return cache.get(name);
    const e = entries.get(name);
    const start = e.lho + 30 + dv.getUint16(e.lho + 26, true) + dv.getUint16(e.lho + 28, true);
    const raw = buf.subarray(start, start + e.csize);
    let out;
    if (e.method === 0) out = raw;
    else if (e.method === 8) out = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    else throw new Error(`This EPUB uses a compression this page can't read (${name}).`);
    cache.set(name, out); return out;
  }
  return { find, bytes, text: async n => { const b = await bytes(n); return b ? new TextDecoder().decode(b) : null; } };
}

/* ---------------- .annot parsing ---------------- */
function parsePoint(raw) {
  if (!raw) return null;
  const m = raw.match(/^(.*?)#point\((.*)\)\s*$/);
  if (!m) return { file: decodeSafe(raw.split('#')[0]), steps: [], offset: null };
  const [path, off] = m[2].split(':');
  const steps = path.split('/').filter(Boolean).map(s => parseInt(s, 10)).filter(n => !isNaN(n));
  return { file: decodeSafe(m[1]), steps, offset: off != null ? (parseInt(off, 10) || 0) : null };
}
function parseAnnot(text, name) {
  const doc = xml(text);
  if (doc.getElementsByTagName('parsererror').length || doc.documentElement.localName !== 'annotationSet')
    throw new Error(`${name} isn't a Kobo highlights (.annot) file.`);
  const kid = (node, ns, tag) => node ? [...node.children].find(c => c.localName === tag && (!ns || c.namespaceURI === ns)) : null;
  const dc = (node, tag) => (kid(node, DC, tag)?.textContent || '').trim();
  const pub = doc.getElementsByTagNameNS(ANS, 'publication')[0];
  const meta = { title: dc(pub, 'title'), creator: dc(pub, 'creator').replace(/[;,\s]+$/, ''), identifier: dc(pub, 'identifier') };
  const list = [];
  for (const a of doc.getElementsByTagNameNS(ANS, 'annotation')) {
    const frag = a.getElementsByTagNameNS(ANS, 'fragment')[0];
    if (!frag) continue;
    const startRaw = frag.getAttribute('start') || '', endRaw = frag.getAttribute('end') || startRaw;
    const txt = (kid(frag, null, 'text')?.textContent || '').replace(/\s+/g, ' ').trim();
    const note = (kid(kid(a, null, 'content'), null, 'text')?.textContent || '').trim();
    const start = parsePoint(startRaw);
    list.push({
      uid: dc(a, 'identifier'), date: dc(a, 'date'), start, end: parsePoint(endRaw), startRaw, endRaw,
      text: txt, note, progress: parseFloat(frag.getAttribute('progress')), color: colorKey(frag.getAttribute('color') || '1'),
      kind: txt ? 'highlight' : (note ? 'note' : 'bookmark'), file: start ? start.file : ''
    });
  }
  return { meta, list };
}

/* ---------------- EPUB loading ---------------- */
function indexBook(book) {
  book.byPath = new Map(); book.byLower = new Map(); book.byBase = new Map();
  for (const c of book.chapters) {
    book.byPath.set(c.path, c); book.byLower.set(c.path.toLowerCase(), c);
    const b = c.path.split('/').pop().toLowerCase(); book.byBase.set(b, book.byBase.has(b) ? null : c);
  }

    const row = el('div', 'row'); row.appendChild(filesButton('Add the .epub…')); b.appendChild(row);
  }
  if (S.book && !S.annots.length) {
    const b = banner(); b.appendChild(el('p', null, 'Add the .annot file to show your highlights in this book.'));
    const row = el('div', 'row'); row.appendChild(filesButton('Add the .annot…')); b.appendChild(row);
  }
  if (S.book && S.annots.length && !S.sampleBook && !S.sampleAnnots) {
    const hs = S.annots.filter(a => a.kind === 'highlight');
    const found = hs.filter(a => ['exact', 'approx'].includes(S.placed.get(a.id)?.how)).length;
    const norm = s => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    const sameIsbn = S.meta?.identifier && S.book.idents.some(i => norm(i).includes(norm(S.meta.identifier)));
    const sameTitle = S.meta?.title && norm(S.book.title).startsWith(norm(S.meta.title).slice(0, 12));
    if (!sameIsbn && !sameTitle && S.meta?.title)
      banner('warn').appendChild(el('p', null, `These highlights are for “${S.meta.title}”, but the .epub is “${S.book.title}”.`));
    if (hs.length && found < hs.length)
      banner(found < hs.length * 0.6 ? 'warn' : '').appendChild(el('p', null,
        `${found} of ${hs.length} highlights were found in this .epub. ${found < hs.length * 0.6 ? 'It may be a different edition from the one on the Kobo.' : 'The others are marked below.'}`));
  }
}
function visible(a) {
  if (!isHead(a)) return false;
  if (a.kind === 'bookmark' && !S.showBm) return false;
  if (a.kind === 'highlight' && S.colorsOff.has(a.color)) return false;
  const note = fullNote(a);
  if (S.notesOnly && !note) return false;
  const q = S.q.trim().toLowerCase();
  return !q || fullText(a).toLowerCase().includes(q) || note.toLowerCase().includes(q);
}
function entry(a) {
  const rs = a.parts.map(p => S.placed.get(p.id)), hows = rs.map(r => r ? r.how : 'missing');
  const jumpable = S.book && rs.some(r => r && r.from != null);
  const c = el('article', `entry c${a.color}${a.kind === 'bookmark' ? ' bookmark' : ''}${jumpable ? ' clickable' : ''}`);
  c.dataset.id = a.id;
  const text = fullText(a), note = fullNote(a);
  if (a.kind === 'bookmark') { const q = el('div', 'quote'); q.appendChild(el('span', 'ribbon')); q.append('Bookmark'); c.appendChild(q); }
  else if (text) { const q = el('blockquote', 'quote'); q.appendChild(el('span', null, text)); c.appendChild(q); }
  if (note) c.appendChild(el('div', 'note', note));
  const meta = el('div', 'meta');
  if (!isNaN(a.progress)) meta.appendChild(el('span', null, `${pct(a.progress)} through the book`));
  if (a.date) meta.appendChild(el('span', null, fmtDate(a.date)));
  if (a.parts.length > 1) meta.appendChild(el('span', null, 'joined across a page turn'));
  if (S.book && a.kind === 'highlight') {
    if (hows.every(h => h === 'missing')) meta.appendChild(el('span', 'flag', 'Not found in this .epub'));
    else if (hows.some(h => h === 'anchor' || h === 'missing')) meta.appendChild(el('span', 'flag', 'Text not matched, jumps to its spot'));
    else if (hows.includes('approx')) meta.appendChild(el('span', null, 'Matched approximately'));
  }
  c.appendChild(meta);
  if (jumpable) { c.tabIndex = 0; c.onclick = () => jump(a.id); c.onkeydown = e => { if (e.key === 'Enter') jump(a.id); }; }
  return c;
}
function renderList() {
  const list = $('#list'); list.textContent = '';
  const groups = [];
  for (const a of S.annots) {
    if (!visible(a)) continue;
    if (!groups.length || groups[groups.length - 1].file !== a.file) groups.push({ file: a.file, items: [] });
    groups[groups.length - 1].items.push(a);
  }
  if (!groups.length && S.annots.length) { list.appendChild(el('div', 'empty', 'Nothing matches these filters.')); return; }
  for (const g of groups) {
    const h = el('h3', 'group-title'); h.appendChild(el('span', null, chapterTitle(g.file))); h.appendChild(el('span', null, String(g.items.length)));
    list.appendChild(h);
    for (const a of g.items) list.appendChild(entry(a));
  }
}

/* ---------------- interactions ---------------- */
const narrow = () => matchMedia('(max-width: 899px)').matches;
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function showTab(which) {
  document.body.classList.toggle('show-panel', which === 'list');
  $('#tabBook').setAttribute('aria-selected', String(which !== 'list'));
  $('#tabList').setAttribute('aria-selected', String(which === 'list'));
}
function setActive(id) {
  document.querySelectorAll('.entry.active').forEach(c => c.classList.remove('active'));
  const c = document.querySelector(`.entry[data-id="${id}"]`); if (c) c.classList.add('active');
  return c;
}
function jump(id) {
  const a = S.byId.get(id);
  const targets = (a ? a.parts : [{ id }]).flatMap(p => [...document.querySelectorAll(`#reader [data-id="${p.id}"]`)]);
  if (!targets.length) return;
  if (narrow()) showTab('book');
  setActive(id);
  targets[0].scrollIntoView({ block: 'center', behavior: narrow() || reduced() ? 'auto' : 'smooth' });
  targets.forEach(t => { t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash'); });
}
$('#reader').addEventListener('click', e => {
  const link = e.target.closest('a[data-goto]');
  if (link) {
    e.preventDefault();
    const [p, frag] = link.dataset.goto.split('#'), ch = findChapter(p);
    if (!ch) return;
    const t = (frag && document.getElementById(`x${ch.index}-${frag}`)) || document.getElementById('ch' + ch.index);
    t?.scrollIntoView({ block: 'start' });
    return;
  }
  const m = e.target.closest('[data-id]');
  if (!m) return;
  const id = S.byId.get(m.dataset.id)?.head.id || m.dataset.id;
  if (narrow()) showTab('list');
  if (!setActive(id)) {  // hidden by filters: clear them so the entry shows
    S.q = ''; $('#search').value = ''; S.colorsOff.clear(); S.notesOnly = false; S.showBm = true; renderChips(); renderList();
  }
  setActive(id)?.scrollIntoView({ block: 'nearest', behavior: narrow() || reduced() ? 'auto' : 'smooth' });
});
$('#search').addEventListener('input', e => { S.q = e.target.value; renderList(); });
$('#tabBook').onclick = () => showTab('book');
$('#tabList').onclick = () => showTab('list');

function toMarkdown() {
  const L = [`# ${S.meta?.title || S.book?.title || 'Highlights'}`];
  const who = S.meta?.creator || S.book?.creator; if (who) L.push('', `*${who}*`);
  let cur = null;
  for (const a of S.annots) {
    if (a.kind === 'bookmark' || !isHead(a)) continue;
    if (a.file !== cur) { cur = a.file; L.push('', `## ${chapterTitle(a.file)}`); }
    const text = fullText(a), note = fullNote(a);
    L.push('');
    if (text) L.push(`> ${text}`);
    if (note) { if (text) L.push(''); L.push(`**Note:** ${note.replace(/\n/g, '  \n')}`); }
  }
  return L.join('\n') + '\n';
}
function showCopySheet(md) {
  const veil = el('div', 'sheet-veil'), sheet = el('div', 'sheet');
  sheet.setAttribute('role', 'dialog'); sheet.setAttribute('aria-label', 'Your notes as text');
  sheet.appendChild(el('h2', null, 'Your notes as text'));
  sheet.appendChild(el('p', null, 'Select all of it, copy it, and paste it into Notes, Docs or Obsidian.'));
  const ta = el('textarea'); ta.id = 'copyText'; ta.readOnly = true; ta.value = md; sheet.appendChild(ta);
  const row = el('div', 'row'), close = el('button', 'btn', 'Close'); close.type = 'button';
  const done = () => veil.remove();
  close.onclick = done; veil.onclick = e => { if (e.target === veil) done(); };
  veil.onkeydown = e => { if (e.key === 'Escape') done(); };
  row.appendChild(close); sheet.appendChild(row); veil.appendChild(sheet); document.body.appendChild(veil);
  ta.focus(); ta.select();
}
$('#copyBtn').onclick = async () => {
  const md = toMarkdown(), n = S.annots.filter(a => a.kind !== 'bookmark' && isHead(a)).length;
  try { await navigator.clipboard.writeText(md); toast(`Copied ${n} highlight${n === 1 ? '' : 's'} as text. Paste them anywhere.`); }
  catch { showCopySheet(md); }
};

async function handleFiles(files) {
  const arr = [...files]; if (!arr.length) return;
  const annotTexts = []; let epub = null;
  try {
    for (const f of arr) {
      const head = new Uint8Array(await f.slice(0, 2).arrayBuffer());
      if (head[0] === 0x50 && head[1] === 0x4b) epub = f;
      else annotTexts.push({ name: f.name, text: await f.text() });
    }
    let newAnnots = null, newMeta = null, newBook = null;
    if (annotTexts.length) {
      const parsed = annotTexts.map(x => parseAnnot(x.text, x.name));
      const seen = new Set(); newAnnots = [];
      for (const p of parsed) for (const a of p.list) {
        const k = a.uid || `${a.startRaw}|${a.endRaw}|${a.text}`;
        if (!seen.has(k)) { seen.add(k); newAnnots.push(a); }
      }
      newAnnots.forEach((a, i) => { a.id = 'h' + i; });
      newMeta = parsed[0].meta;
    }
    if (epub) { toast('Opening the book…'); newBook = await loadEpub(epub); }
    if (newAnnots) {
      S.annots = newAnnots; S.meta = newMeta; S.sampleAnnots = false;
      S.colorsOff.clear(); S.notesOnly = false; S.showBm = true; S.q = ''; $('#search').value = '';
      if (!newBook && S.sampleBook) { S.book = null; S.sampleBook = false; }
    }
    if (newBook) {
      S.book = newBook; S.sampleBook = false;
      if (!newAnnots && S.sampleAnnots) { S.annots = []; S.meta = null; S.sampleAnnots = false; }
    }
    await rebuild();
    $('#reader').scrollTop = 0; scrollTo(0, 0); $('#panel').scrollTop = 0;
    toast(S.book && S.annots.length ? 'Loaded. Click any highlight to jump to it in the book.' : 'Loaded.');
  } catch (err) {
    console.error(err);
    toast(err.message || String(err), true);
  }
}
$('#pick').addEventListener('change', e => { handleFiles(e.target.files); e.target.value = ''; });
let dragDepth = 0;
addEventListener('dragenter', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); } });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging'); if (e.dataTransfer?.files?.length) handleFiles(e.dataTransfer.files); });

/* ---------------- built-in sample (original text, written for this page) ---------------- */
function loadSample() {
  const chapters = [
    { file: 'OEBPS/text/chapter1.xhtml', title: 'I. Winter', paras: [
      'The keeper’s year began in November, when the supply boat stopped running and the island belonged to the wind. He kept a ledger of small things: the hour the lamp was lit, the oil it burned, the ships that passed close enough to read their names.',
      'Most nights nothing happened, and he wrote that down too. A blank line meant the light had done its work. Over the years he came to think of those empty lines as the truest record he kept, because they showed what had been prevented rather than what had occurred.',
      'On clear evenings he climbed to the gallery and watched the beam sweep across the water, counting the seconds between flashes as if he were taking the pulse of the sea.'] },
    { file: 'OEBPS/text/chapter2.xhtml', title: 'II. Summer', paras: [
      'Summer brought visitors, and visitors brought questions. They wanted to know whether he was lonely, whether the noise of the fog signal kept him awake, whether he had ever seen a wreck.',
      'He answered the way he wrote in the ledger, plainly and without decoration. Loneliness, he told them, was mostly a matter of weather. The fog signal he no longer heard. And the wreck he remembered best was one that never happened, a schooner that turned in time because the light was where it was supposed to be.',
      'When the last boat of the season left in October, he walked the island once from end to end and then went up to light the lamp.'] }
  ];
  const doc = c => `<?xml version="1.0" encoding="utf-8"?>\n<html xmlns="http://www.w3.org/1999/xhtml">\n<head><title>${esc(c.title)}</title></head>\n<body>\n<section>\n<h1>${esc(c.title)}</h1>\n${c.paras.map(p => `<p>${esc(p)}</p>`).join('\n')}\n</section>\n</body>\n</html>`;
  // [chapter, paragraph, quoted text or null for a bookmark, colour, minutes after start, note, start offset override]
  const picks = [
    [0, 0, 'He kept a ledger of small things', '1', 0],
    [0, 1, 'A blank line meant the light had done its work.', '1', 3],
    [0, 1, 'Over the years he came to think of those empty lines as the truest record he kept,', '2', 5, 'The whole book in one sentence: the record of what didn’t happen.'],
    [0, 1, 'because they showed what had been prevented rather than what had occurred.', '2', 6],
    [0, 2, null, '0', 9],
    [1, 1, 'Loneliness, he told them, was mostly a matter of weather.', '3', 30, 'True for me too, honestly.'],
    [1, 1, 'the wreck he remembered best was one that never happened', '4', 32]
  ];
  const t0 = Date.parse('2026-10-04T19:10:00Z');
  const total = chapters.reduce((n, c) => n + c.paras.join(' ').length, 0);
  const before = (ci, pi) => chapters.slice(0, ci).reduce((n, c) => n + c.paras.join(' ').length, 0) + chapters[ci].paras.slice(0, pi).join(' ').length;
  const ann = picks.map(([ci, pi, text, color, min, note], k) => {
    const c = chapters[ci], para = c.paras[pi], off = text ? para.indexOf(text) : 0;
    const pt = o => `${c.file}#point(/1/4/2/${2 * pi + 4}/1:${o})`;
    const prog = ((before(ci, pi) + off) / total).toFixed(4);
    return `<annotation><dc:identifier>urn:uuid:sample-${k}</dc:identifier><dc:date>${new Date(t0 + min * 60000).toISOString().replace('.000', '')}</dc:date>` +
      `<target><fragment start="${pt(off)}" end="${pt(text ? off + text.length : off)}" progress="${prog}" color="${color}">${text ? `<text>${esc(text)}</text>` : ''}</fragment></target>` +
      (note ? `<content><text>${esc(note)}</text></content>` : '') + '</annotation>';
  });
  const annotXml = `<annotationSet xmlns:dc="${DC}" xmlns="${ANS}"><publication><dc:identifier>sample</dc:identifier><dc:title>The Keeper’s Year</dc:title><dc:creator>Sample text</dc:creator></publication>${ann.join('')}</annotationSet>`;
  const parsed = parseAnnot(annotXml, 'sample');
  parsed.list.forEach((a, i) => { a.id = 'h' + i; });
  S.annots = parsed.list; S.meta = parsed.meta;
  S.book = indexBook({ name: 'sample', title: 'The Keeper’s Year', creator: 'Sample text', idents: [],
    zip: { bytes: async () => null }, chapters: chapters.map((c, i) => ({ path: c.file, raw: doc(c), index: i, title: c.title })) });
  S.sampleAnnots = S.sampleBook = true;
  return rebuild();
}
loadSample().catch(err => { console.error(err); toast('The sample could not load. You can still open your own files.', true); });
</script>
